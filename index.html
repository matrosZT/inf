<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мої проєкти</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #18181b;
      --text-muted: #71717a;
      --accent: #2563eb;
      --border-color: #e4e4e7;
      --hover-bg: #f4f4f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #09090b;
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --accent: #60a5fa;
        --border-color: #27272a;
        --hover-bg: #18181b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 3rem 1.5rem;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    /* Головний список (1-й рівень: категорії/розділи) */
    ul.categories {
      list-style: none;
    }

    ul.categories > li {
      margin-bottom: 2.5rem;
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    /* Вкладений список (2-й рівень: самі проєкти) */
    ul.projects {
      list-style: none;
    }

    ul.projects li {
      margin-bottom: 0.25rem;
    }

    ul.projects a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      text-decoration: none;
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      margin: 0 -0.75rem;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    ul.projects a:hover {
      background-color: var(--hover-bg);
    }

    ul.projects a:hover .project-name {
      color: var(--accent);
    }

    .project-name {
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .project-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-left: 1rem;
      text-align: right;
    }

    /* Адаптація для вузьких екранів */
    @media (max-width: 500px) {
      ul.projects a {
        flex-direction: column;
      }
      .project-desc {
        margin-left: 0;
        text-align: left;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Мої сторінки</h1>
    <p class="subtitle">Архів вебсторінок на GitHub Pages</p>
  </header>

  <main>
    <!-- ПЕРШИЙ РІВЕНЬ СПИСКУ: Категорії -->
    <ul class="categories">
      
      <li>
        <div class="category-title">10 клас</div>
        <!-- ДРУГИЙ РІВЕНЬ СПИСКУ: Посилання -->
        <ul class="projects">
          <li>
            <a href="./10/excel-optimization/">
              <span class="project-name">Ексель оптимізаційні задачі</span>
              <span class="project-desc">Ексель оптимізаційні задачі</span>
            </a>
          </li>
          
        </ul>
      </li>

      <!-- <li>
        <div class="category-title">Ігри та експерименти</div>
        <ul class="projects">
          <li>
            <a href="./snake-js/">
              <span class="project-name">Змійка на Canvas</span>
              <span class="project-desc">Класична гра без бібліотек</span>
            </a>
          </li>
          <li>
            <a href="https://username.github.io/other-repo/">
              <span class="project-name">Інший репозиторій</span>
              <span class="project-desc">Зовнішнє посилання на іншу сторінку</span>
            </a>
          </li>
        </ul>
      </li> -->

    </ul>
  </main>

</body>
</html>
